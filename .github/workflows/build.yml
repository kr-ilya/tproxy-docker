name: Build and push Docker image

on:
  push:
    branches: [main]
    paths: ["Dockerfile"]
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

concurrency: build

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/tproxy-server

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        run: |
          commit=$(sed -n 's/^ARG TPROXY_COMMIT=//p' Dockerfile)
          if [ -z "$commit" ]; then
            echo "TPROXY_COMMIT not found in Dockerfile" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short=${commit:0:7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: TPROXY_COMMIT=${{ steps.tags.outputs.commit }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.short }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.date }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
