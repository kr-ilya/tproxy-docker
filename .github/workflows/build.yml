name: Build Docker image

on:
  push:
    branches: [main, "renovate/**"]
    paths: ["Dockerfile"]
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/tproxy-server

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image tags
        id: tags
        run: |
          commit=$(sed -n 's/^ARG TPROXY_COMMIT=//p' Dockerfile)
          repo=$(sed -n 's/^ARG TPROXY_REPO_URL=//p' Dockerfile)
          if [ -z "$commit" ] || [ -z "$repo" ]; then
            echo "TPROXY_COMMIT or TPROXY_REPO_URL not found in Dockerfile" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "upstream=${commit:0:7}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: TPROXY_COMMIT=${{ steps.tags.outputs.commit }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:src-${{ steps.tags.outputs.upstream }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.tags.outputs.build }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.upstream }}
            io.tproxy.upstream.source=${{ steps.tags.outputs.repo }}
            io.tproxy.upstream.revision=${{ steps.tags.outputs.commit }}
